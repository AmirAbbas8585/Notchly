<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notchly Settings</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="win-frame">
  <header class="titlebar" data-tauri-drag-region>
    <div class="tb-brand" data-tauri-drag-region>
      <span class="tb-title" id="tb-title">Notchly Settings</span>
    </div>
    <button class="live-notch" id="live-notch" type="button" data-st-tip="Notchly">
      <span class="ln-eyes" id="ln-eyes"><i id="ln-e1"></i><i id="ln-e2"></i></span>
      <span class="ln-clock" id="ln-clock"></span>
    </button>
    <div class="win-btns">
      <button class="win-btn" id="win-min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button class="win-btn" id="win-max" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="win-btn close" id="win-close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
  </header>

  <div class="shell">
    <aside class="side">
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="ver-line" id="ver">v1.0.1</div>
        <button class="upd-btn" id="upd-btn"></button>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="main-scroll">
        <header class="page-head">
          <h1 id="page-title"></h1>
          <p id="page-sub"></p>
        </header>
        <div class="page-body" id="body"></div>
      </div>

      <footer class="live-dock">
        <span class="dock-lbl" id="dock-lbl">Live Preview</span>
        <div class="dock-pill" id="dock-pill">
          <div class="dock-icons" id="dock-left"></div>
          <div class="dock-center" id="dock-center">
            <span class="dc-eyes" id="dc-eyes"><i></i><i></i></span>
            <span class="dc-clock" id="dc-clock">18:30</span>
          </div>
          <div class="dock-icons" id="dock-right"></div>
        </div>
      </footer>
    </main>
  </div>
</div>
<div id="st-tip"></div>
<script src="settings.js"></script>
</body>
</html>
